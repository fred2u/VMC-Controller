<!DOCTYPE html>
<html lang="en">
<head>
    <title>VMC Controller</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" href="milligram.min.css">
    <link rel="stylesheet" type="text/css" href="style.css">
    <script type="text/javascript" src="script.js"></script>
</head>
<body>
    <div class="container title">
        <h3>VMC Controller</h3>
    </div>
    <div class="container mode">
        <p>Last mode sent: <span id="mode">…</span></p>
    </div>
    <div class="container remote">
        <div class="row">
            <div class="column column-33"><button onclick="send('default')" class="button button-outline">Default</button></div>
            <div class="column column-33"><button onclick="send('auto')" class="button button-outline">Auto</button></div>
        </div>
        <div class="row">
            <div class="column column-33"><button onclick="send('low')" class="button button-outline">Low</button></div>
            <div class="column column-33"><button onclick="send('medium')" class="button button-outline">Medium</button></div>
            <div class="column column-33"><button onclick="send('high')" class="button button-outline">High</button></div>
        </div>
        <div class="row">
            <div class="column column-33"><button onclick="send('max1')" class="button button-outline">Max 15 min</button></div>
            <div class="column column-33"><button onclick="send('max2')" class="button button-outline">Max 30 min</button></div>
            <div class="column column-33"><button onclick="send('max3')" class="button button-outline">Max 60 min</button></div>
        </div>
    </div>
    <div class="container footer">
        <p>Web interface for Orcon 15RF</p>
    </div>
</body>
</html>
