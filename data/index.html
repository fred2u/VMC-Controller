<!DOCTYPE html>
<html lang="en">
<head>
    <title>VMC Controller</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f766e">
    <link rel="stylesheet" type="text/css" href="style.css">
    <script type="text/javascript" src="script.js"></script>
</head>
<body>
    <header class="top">
        <h1>VMC Controller</h1>
        <span id="link" class="link">Connecting…</span>
    </header>

    <main>
        <section class="card status" aria-live="polite">
            <svg class="fan" viewBox="0 0 24 24" aria-hidden="true">
                <g id="fan">
                    <path d="M12 12c0-4 1-8 4-8s3 4-4 8z"/>
                    <path d="M12 12c4 0 8 1 8 4s-4 3-8-4z"/>
                    <path d="M12 12c0 4-1 8-4 8s-3-4 4-8z"/>
                    <path d="M12 12c-4 0-8-1-8-4s4-3 8 4z"/>
                </g>
                <circle cx="12" cy="12" r="1.6"/>
            </svg>
            <div>
                <p class="label">Last mode sent</p>
                <p id="mode" class="mode">…</p>
                <p id="until" class="hint"></p>
            </div>
        </section>

        <section class="group">
            <h2>Speed</h2>
            <div class="grid three">
                <button data-cmd="low" data-mode="Low">Low</button>
                <button data-cmd="medium" data-mode="Medium">Medium</button>
                <button data-cmd="high" data-mode="High">High</button>
            </div>
        </section>

        <section class="group">
            <h2>Program</h2>
            <div class="grid two">
                <button data-cmd="default" data-mode="Default">Default</button>
                <button data-cmd="auto" data-mode="Auto">Auto</button>
            </div>
        </section>

        <section class="group boost">
            <h2>Max <span id="boost-hint" class="hint"></span></h2>
            <div class="grid three">
                <button data-cmd="max1" data-mode="Max 15 min">15 min</button>
                <button data-cmd="max2" data-mode="Max 30 min">30 min</button>
                <button data-cmd="max3" data-mode="Max 60 min">60 min</button>
            </div>
        </section>
    </main>

    <footer>
        <p>Web interface for Orcon 15RF</p>
        <dl>
            <div><dt>Firmware</dt><dd id="version">…</dd></div>
            <div><dt>IP address</dt><dd id="ip">…</dd></div>
            <div><dt>Name</dt><dd id="hostname">…</dd></div>
            <div><dt>Wi-Fi</dt><dd id="rssi">…</dd></div>
        </dl>
    </footer>
</body>
</html>
