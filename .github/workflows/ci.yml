name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Unit tests (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio
      - run: pio test -e native

  build:
    name: Firmware build (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # espmxdevkit: production board (ESP8285). nodemcuv2: test board.
        env: [espmxdevkit, nodemcuv2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio
      # include/wifi.h is gitignored (it holds the Wi-Fi password).
      - run: cp include/wifi.h.example include/wifi.h
      - run: pio run -e ${{ matrix.env }}
      # Check that the data/ folder still packs into a LittleFS image.
      - run: pio run -e ${{ matrix.env }} --target buildfs
