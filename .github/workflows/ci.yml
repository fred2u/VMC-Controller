name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Unit tests (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio
      - run: pio test -e native

  build:
    name: Firmware build (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # espmxdevkit: production board (ESP8285). nodemcuv2: test board.
        env: [espmxdevkit, nodemcuv2]
    steps:
      - uses: actions/checkout@v4
        with:
          # Whole history with the tags, so the firmware version (git
          # describe, scripts/version.py) is the same as on a computer.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio
      # Dummy passwords, so the OTA and password code is built and counted in
      # the size. The production board gets every option (largest firmware),
      # the test board none of the optional ones, so both variants build.
      - run: pio run -e ${{ matrix.env }}
        env:
          VMC_OTA_PASSWORD: ci-dummy-password
          VMC_HTTP_PASSWORD: ${{ matrix.env == 'espmxdevkit' && 'ci-dummy-password' || '' }}
          VMC_SETUP_PASSWORD: ${{ matrix.env == 'espmxdevkit' && 'ci-dummy-password' || '' }}
          VMC_MQTT_HOST: ${{ matrix.env == 'espmxdevkit' && 'broker.example' || '' }}
      # Check that the data/ folder still packs into a LittleFS image.
      - run: pio run -e ${{ matrix.env }} --target buildfs
