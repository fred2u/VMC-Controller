; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; `pio run` and `pio run --target upload` only build the ESP firmware.
default_envs = espmxdevkit

; Settings shared by every ESP8266 board.
[esp8266]
platform = espressif8266
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs

; The registry name "me-no-dev/ESP Async WebServer" no longer resolves
; (library archived in 2025), so point at the original GitHub repos,
; pinned to their last commit (they have no version tags).
lib_deps =
  https://github.com/me-no-dev/ESPAsyncTCP.git#191bdeb2555bf86e213ecb816227d125753b608e
  https://github.com/me-no-dev/ESPAsyncWebServer.git#ad3741d159f9cfd50c567e81b67f3bef1dc6d89f

; Production board, inside the VMC enclosure: DOIT ESP-Mx DevKit (ESP8285).
[env:espmxdevkit]
extends = esp8266
board = espmxdevkit

; Test board on the desk: NodeMCU v3 (LoLin, ESP-12 with 4 MB flash, CH340).
; Same code and same GPIOs, see "Test board (NodeMCU)" in the README.
;   pio run -e nodemcuv2 --target upload
;   pio run -e nodemcuv2 --target uploadfs
[env:nodemcuv2]
extends = esp8266
board = nodemcuv2

; Unit tests on the computer, no ESP needed: pio test -e native
; src/main.cpp is compiled unchanged against the fakes in test/mocks/.
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -I test/mocks
