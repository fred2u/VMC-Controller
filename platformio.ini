; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; `pio run` and `pio run --target upload` only build the ESP firmware.
default_envs = espmxdevkit

; Settings shared by every ESP8266 board.
[esp8266]
; Pinned so a build gives the same firmware over time (Arduino core 3.1.2).
platform = espressif8266@4.2.1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
; OTA password from the VMC_OTA_PASSWORD environment variable (see README):
; built into the firmware, and passed to uploads over Wi-Fi only.
; Firmware version from the Git tags (git describe), see "Releases" in the README.
extra_scripts =
  pre:scripts/ota_password.py
  post:scripts/ota_auth.py
  post:scripts/version.py

; Maintained forks of the archived me-no-dev libraries, pinned to a release.
lib_deps =
  esp32async/ESPAsyncTCP@2.0.0
  esp32async/ESPAsyncWebServer@3.12.1
  ; Wi-Fi setup portal, built on the same async web server (see README).
  alanswx/ESPAsyncWiFiManager@0.31

; Production board, inside the VMC enclosure: DOIT ESP-Mx DevKit (ESP8285).
[env:espmxdevkit]
extends = esp8266
board = espmxdevkit
; 1 MB flash: 64 KB for LittleFS (the web interface is about 11 KB) instead
; of the default 256 KB, so an update over Wi-Fi (OTA) has room for the old
; and the new firmware. Changing this moves LittleFS: flash over USB and
; run uploadfs again.
board_build.ldscript = eagle.flash.1m64.ld

; Same firmware, uploaded over Wi-Fi (OTA) to vmc.local:
;   pio run -e espmxdevkit_ota --target upload
;   pio run -e espmxdevkit_ota --target uploadfs
; Any other name or address works with --upload-port, see the README.
[env:espmxdevkit_ota]
extends = env:espmxdevkit
upload_protocol = espota
upload_port = vmc.local

; Test board on the desk: NodeMCU v3 (LoLin, ESP-12 with 4 MB flash, CH340).
; Same code and same GPIOs, see "Test board (NodeMCU)" in the README.
;   pio run -e nodemcuv2 --target upload
;   pio run -e nodemcuv2 --target uploadfs
; Over Wi-Fi (OTA), see "Updates over Wi-Fi" in the README:
;   pio run -e nodemcuv2_ota --target upload
[env:nodemcuv2]
extends = esp8266
board = nodemcuv2
; Its own network name, so it never takes "vmc" from the production board
; (router DNS, Home Assistant, vmc.local). Reach it at http://vmc-test/.
build_flags = '-D VMC_HOSTNAME="vmc-test"'

; Same firmware, uploaded over Wi-Fi (OTA) to vmc-test.local.
[env:nodemcuv2_ota]
extends = env:nodemcuv2
upload_protocol = espota
upload_port = vmc-test.local

; Unit tests on the computer, no ESP needed: pio test -e native
; src/main.cpp is compiled unchanged against the fakes in test/mocks/.
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -I test/mocks
