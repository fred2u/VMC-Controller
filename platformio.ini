; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; `pio run` and `pio run --target upload` only build the ESP firmware.
default_envs = espmxdevkit

[env:espmxdevkit]
platform = espressif8266
board = espmxdevkit
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs

lib_deps =
  me-no-dev/ESP Async WebServer

; Unit tests on the computer, no ESP needed: pio test -e native
; src/main.cpp is compiled unchanged against the fakes in test/mocks/.
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -I test/mocks
